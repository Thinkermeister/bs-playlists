name: build playlists

on:
  schedule:
    - cron: "30 21 * * *"   # 毎日 06:30 JST
    - cron: "0 3,9,15 * * *" # 12:00 / 18:00 / 24:00 JST（練習リストの更新用）
  workflow_dispatch:
    inputs:
      force_challenge:
        description: 'チャレンジリストを間隔を無視して強制再生成する'
        type: boolean
        default: false
  push:
    paths:
      - sources.txt
      - practice.txt
      - challenge.txt
      - discover.txt
      - build.py

permissions:
  contents: write

# 同時に2本走らせない。設定ファイルを続けて編集すると push トリガが重なり、
# 後発が git pull --rebase で衝突して失敗する（2026-09-05 の #54 がこれ）。
# 待たせれば、後発はチェックアウト時点で先発の結果を取り込める。
concurrency:
  group: build-playlists
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install pillow
        run: pip install --quiet pillow
      - name: build
        env:
          SCORESABER_ID: ${{ secrets.SCORESABER_ID }}
          BEATLEADER_ID: ${{ secrets.BEATLEADER_ID }}
          FORCE_CHALLENGE: ${{ github.event.inputs.force_challenge == 'true' && '1' || '0' }}
        run: python build.py
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "update playlists $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
